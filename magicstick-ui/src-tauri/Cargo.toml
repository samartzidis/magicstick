[package]
name = "magicstick-ui"
version = "3.2.0"
description = "MagicStick UI"
authors = ["George Samartzidis"]
license = "MIT"
repository = "https://github.com/samartzidis/magicstick"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "magicstick_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dotnet = "0.1.1"

[features]
# Embeds the frontend in the binary. `tauri dev` / `tauri build` enable it; a plain `cargo build` needs it explicitly.
custom-protocol = ["tauri/custom-protocol"]
# Embeds the .NET backend in the executable instead of loading it from files. Build the backend first with
# `dotnet build src-dotnet/MagicStickUI.Backend -p:TauriDotNetEmbed=true` (add `-c Release` for a release build), which
# writes MagicStickUI.Backend.tdnbundle into the build output folder that src/lib.rs includes.
embedded-backend = []
